<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dragon Imperial Platinum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="transitionOverlay" class="smoke-overlay"></div>
    <div id="parallaxBg" class="parallax-layer"></div>

    <div id="loginOverlay" class="login-bg">
        <div class="login-box">
            <img src="assets/logo.png" alt="Logo" class="login-logo">
            <input type="text" id="usernameInput" placeholder="NAMA PEMAIN...">
            <button class="primary-btn" onclick="handleLogin()">MULAI BERMAIN</button>
            <p class="version-tag">PLATINUM EDITION V1.0</p>
        </div>
    </div>

    <div class="mobile-wrapper" id="mainGame" style="display:none;">
        <img src="assets/icons/dragon_body.png" class="dragon" id="fsDragon">

        <div class="header">
            <div class="level-container">
                <div class="level-info">
                    <div class="lvl-badge">
                        <span id="userLevel">LV. 1</span>
                        <small id="levelName">NEWBIE DRAGON</small>
                    </div>
                    <div id="lvlRewardAnim" class="reward-pop" style="display:none;">+BONUS SALDO!</div>
                </div>
                <div class="xp-bar-bg"><div id="xpProgress" class="xp-bar-fill"></div></div>
            </div>
            <button id="muteBtn" onclick="toggleMute()">🔊</button>
        </div>

        <div class="grand-jackpot-header">
            <span>GRAND JACKPOT</span>
            <h2 id="jackpotAmount">5,000,000</h2>
        </div>

        <div class="multiplier-container">
            <div id="multiDisplay" class="multi-bubble">x1</div>
        </div>

        <div class="slot-machine-frame">
            <div class="grid-container" id="grid"></div>
        </div>

        <div class="new-footer-panel">
            <div class="stats-box-row">
                <div class="stat-box">
                    <label>SALDO</label>
                    <b id="balance">Rp 0</b>
                </div>
                <div class="stat-box">
                    <label>WIN</label>
                    <b id="winDisplay">Rp 0</b>
                </div>
            </div>

            <div class="action-bar">
                <button id="spinBtn" class="gold-btn-spin" onclick="startSpin()">SPIN</button>
                <div class="bet-info-pill">
                    <span>BET</span>
                    <b id="betDisplay">25k</b>
                </div>
                <button class="black-btn" onclick="changeBet(25000)">+</button>
                <button class="black-btn" onclick="toggleAuto()">AUTO</button>
            </div>
        </div>

        <div class="win-history-wrapper">
            <div class="history-header"><span>RIWAYAT KEMENANGAN</span></div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
