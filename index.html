<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Imperial Platinum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="transitionOverlay" class="smoke-overlay"></div>

    <div id="loginOverlay" class="modal-overlay">
        <div class="login-box">
            <img src="assets/logo.png" alt="Dragon Logo" class="login-logo">
            <input type="text" id="usernameInput" placeholder="Masukkan Username...">
            <button class="primary-btn" onclick="handleLogin()">MULAI BERMAIN</button>
        </div>
    </div>

    <div id="adminPanel" class="modal-overlay" style="display:none; z-index: 9999;">
        <div class="modal-content admin-box">
            <h3 style="color: #ff4444;">DRAGON ADMIN PANEL</h3>
            <div class="admin-group">
                <label>MODIFIKASI SALDO</label>
                <input type="number" id="setSaldoInput" placeholder="Jumlah...">
                <button onclick="adminSetSaldo()">SET SALDO</button>
            </div>
            <div class="admin-group">
                <label>CHEATS & VISUAL</label>
                <button onclick="changeModeWithSmoke(false)">NORMAL MODE</button>
                <button onclick="changeModeWithSmoke(true)" style="background: #400;">FREE SPIN MODE</button>
                <button onclick="adminTriggerMaxwin()" style="background: linear-gradient(gold, orange); color:black;">🔥 AUTO MAXWIN</button>
            </div>
            <button class="close-btn" onclick="toggleAdminPanel()">TUTUP</button>
        </div>
    </div>

    <div class="mobile-wrapper bg-normal" id="mainGame" style="display:none;">
        <div class="header">
            <div class="user-profile">
                <div class="profile-avatar">🐲</div>
                <div class="profile-details">
                    <div id="userNameDisplay">-</div>
                    <div class="level-container">
                        <span class="level-badge">LV.<b id="userLevel">1</b></span>
                        <div class="exp-track"><div id="expFill"></div></div>
                    </div>
                </div>
            </div>
            <button id="muteBtn" onclick="toggleMute()">🔊</button>
        </div>

        <div class="grid-container" id="grid"></div>

        <div id="autoPanel" class="auto-menu" style="display:none;">
            <div class="auto-menu-content">
                <h4>AUTO SPIN</h4>
                <div class="auto-options">
                    <button onclick="setupAuto(10)">10</button>
                    <button onclick="setupAuto(20)">20</button>
                    <button onclick="setupAuto(100)">100</button>
                    <button onclick="setupAuto(999999)">∞</button>
                </div>
                <div class="auto-custom">
                    <input type="number" id="customAutoInput" placeholder="Manual...">
                    <button onclick="setupAuto('custom')">SET</button>
                </div>
                <button class="close-auto" onclick="toggleAutoPanel()">BATAL</button>
            </div>
        </div>

        <div class="footer">
            <div class="stats-row">
                <div class="stat-item" onclick="handleSaldoClick()">
                    <span>SALDO</span>
                    <b id="balance">Rp 0</b>
                </div>
                <div class="stat-item">
                    <span>WIN</span>
                    <b id="winDisplay">Rp 0</b>
                </div>
            </div>

            <div class="main-controls">
                <div class="spin-section">
                    <button id="spinBtn" onclick="startSpin()">SPIN</button>
                    <div class="auto-wrap">
                        <button id="autoOpenBtn" onclick="toggleAutoPanel()">AUTO</button>
                        <span id="autoStatus" style="display:none; color:gold; font-size:10px;"></span>
                    </div>
                </div>

                <div class="bet-section">
                    <div class="bet-adjuster">
                        <button class="circle-btn" onclick="changeBet(-25000)">−</button>
                        <div class="bet-info">
                            <span id="betDisplay">BET: 25k</span>
                            <button class="max-btn-small" onclick="setMaxBet()">MAX BET</button>
                        </div>
                        <button class="circle-btn" onclick="changeBet(25000)">+</button>
                    </div>
                </div>
                
                <div class="extra-section">
                    <button class="info-btn" onclick="togglePaytable()">ℹ️</button>
                </div>
            </div>
        </div>
    </div>

    <div id="bigWinOverlay" class="big-win-overlay" style="display:none;">
        <h2>BIG WIN!</h2>
        <div id="countDisplay">Rp 0</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
