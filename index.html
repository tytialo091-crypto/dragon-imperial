<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Imperial 5x4 Final</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay">
        <h1 class="shimmer-gold">DRAGON IMPERIAL</h1>
        <button id="startBtn">MASUK GAME</button>
    </div>

    <div class="mobile-wrapper" id="mainGame" style="display:none;">
        <img src="assets/dragon.png" class="dragon-bg">
        
        <div class="header">
            <div class="jackpot-box">
                <small>GRAND JACKPOT</small>
                <div id="jpDisplay">5.000.000</div>
            </div>
        </div>

        <div id="multiplierTracker" class="multiplier-tag" style="display:none;">
            <span id="multValue">x2</span>
        </div>

        <div class="grid-container" id="grid"></div>

        <div class="footer">
            <div class="stats-row">
                <div class="stat-item"><span id="triggerAdmin">SALDO</span><b id="balance">100.000</b></div>
                <div class="stat-item"><span>MENANG</span><b id="winDisplay">0</b></div>
            </div>
            
            <div class="controls">
                <div class="bet-adjuster">
                    <button onclick="changeBet(-10)">−</button>
                    <span id="betDisplay">BET: 100</span>
                    <button onclick="changeBet(10)">+</button>
                </div>
                <div class="action-row">
                    <div class="auto-wrap">
                        <input type="checkbox" id="autoCheck">
                        <label for="autoCheck">AUTO</label>
                    </div>
                    <button id="spinBtn">SPIN</button>
                </div>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="admin-modal">
        <h3>ADMIN SETTING</h3>
        <select id="rtpSetting">
            <option value="0.7">PELIT (NORMAL)</option>
            <option value="0.3">GACOR (HIGH)</option>
            <option value="0.01">YOUTUBER (MAXWIN)</option>
        </select>
        <button onclick="addBalance(500000)">+500K SALDO</button>
        <button onclick="cheatMaxWin()" style="background:gold; color:black;">NEXT SPIN MAXWIN</button>
        <button onclick="closeAdmin()" style="background:red; color:white;">TUTUP</button>
    </div>

    <div id="bigWinOverlay" class="modal-overlay">
        <div class="modal-content">
            <h1 class="shimmer-gold">BIG WIN!</h1>
            <div id="bigWinAmount" class="win-text">0</div>
            <button class="collect-btn" onclick="closeBigWin()">COLLECT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
