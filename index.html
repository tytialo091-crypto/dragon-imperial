<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dragon Imperial Platinum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="transitionOverlay" class="smoke-overlay"></div>

    <div id="loginOverlay" class="login-bg">
        <div class="login-box">
            <img src="assets/logo.png" alt="Dragon Logo" class="login-logo">
            <input type="text" id="usernameInput" placeholder="USERNAME...">
            <button class="primary-btn" onclick="handleLogin()">MULAI BERMAIN</button>
            <p class="version-tag">V1.0 PLATINUM EDITION</p>
        </div>
    </div>

    <div id="adminPanel" class="modal-overlay" style="display:none; z-index: 10000;">
        <div class="modal-content admin-box">
            <h3>ADMIN PANEL</h3>
            <div class="admin-group">
                <label>SET SALDO</label>
                <input type="number" id="setSaldoInput" placeholder="Jumlah...">
                <button onclick="adminSetSaldo()">UPDATE</button>
            </div>
            <div class="admin-group">
                <label>VISUAL TEST</label>
                <button onclick="changeModeWithSmoke(false)">NORMAL</button>
                <button onclick="changeModeWithSmoke(true)" style="background:#400;">FREE SPIN</button>
                <button onclick="adminTriggerMaxwin()" style="background:gold; color:#000;">🔥 AUTO MAXWIN</button>
            </div>
            <button class="close-btn" onclick="toggleAdminPanel()">TUTUP</button>
        </div>
    </div>

    <div id="paytableOverlay" class="modal-overlay" style="display:none; z-index: 9998;">
        <div class="modal-content paytable-box">
            <h3 style="color:gold">PAYTABLE (1024 WAYS)</h3>
            <div class="paytable-grid" id="paytableList"></div>
            <button class="close-btn" onclick="togglePaytable()">TUTUP</button>
        </div>
    </div>

    <div class="mobile-wrapper bg-normal" id="mainGame" style="display:none;">
        <div class="header">
            <div class="user-profile">
                <div class="profile-avatar">🐲</div>
                <div class="profile-details">
                    <div id="userNameDisplay">-</div>
                    <div class="level-container">
                        <span>LV.<b id="userLevel">1</b></span>
                    </div>
                </div>
            </div>
            <button id="muteBtn" onclick="toggleMute()">🔊</button>
        </div>

        <div class="grid-container" id="grid"></div>

        <div id="autoPanel" class="auto-menu" style="display:none;">
            <h4>AUTO SPIN</h4>
            <div class="auto-options">
                <button onclick="setupAuto(10)">10</button>
                <button onclick="setupAuto(20)">20</button>
                <button onclick="setupAuto(100)">100</button>
                <button onclick="setupAuto(999999)">∞</button>
            </div>
            <div class="auto-custom">
                <input type="number" id="customAutoInput" placeholder="Manual...">
                <button onclick="setupAuto('custom')">SET</button>
            </div>
            <button class="close-auto" onclick="toggleAutoPanel()">BATAL</button>
        </div>

        <div class="footer">
            <div class="stats-row">
                <div class="stat-item" onclick="handleSaldoClick()">
                    <span>SALDO</span>
                    <b id="balance">Rp 0</b>
                </div>
                <div class="stat-item">
                    <span>WIN</span>
                    <b id="winDisplay">Rp 0</b>
                </div>
            </div>

            <div class="control-container">
                <div class="left-controls">
                    <button id="spinBtn" onclick="startSpin()">SPIN</button>
                    <div class="auto-wrapper">
                        <button id="autoOpenBtn" onclick="toggleAutoPanel()">AUTO</button>
                        <div id="autoStatus" style="display:none;"></div>
                    </div>
                </div>

                <div class="center-controls">
                    <div class="bet-adjuster">
                        <button class="adjust-btn" onclick="changeBet(-25000)">−</button>
                        <div class="bet-display-box">
                            <span class="label-bet">BET</span>
                            <b id="betDisplay">25k</b>
                            <button class="max-bet-btn" onclick="setMaxBet()">MAX BET</button>
                        </div>
                        <button class="adjust-btn" onclick="changeBet(25000)">+</button>
                    </div>
                </div>

                <div class="right-controls">
                    <button class="info-circle" onclick="togglePaytable()">i</button>
                </div>
            </div>
        </div>
    </div>

    <div id="bigWinOverlay" class="big-win-overlay" style="display:none;">
        <h2 id="winTitle">BIG WIN!</h2>
        <div id="countDisplay">Rp 0</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
