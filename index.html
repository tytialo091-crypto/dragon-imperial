<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dragon Imperial Platinum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="parallaxBg" class="parallax-layer"></div>

    <div id="loginOverlay" class="login-bg">
        <div class="login-box">
            <h2 class="gold-text">DRAGON LOGIN</h2>
            <input type="text" id="usernameInput" placeholder="MASUKKAN USERNAME...">
            <button class="primary-btn" onclick="handleLogin()">MASUK & MUAT DATA</button>
        </div>
    </div>

    <div class="mobile-wrapper" id="mainGame" style="display:none;">
        <img src="assets/icons/dragon_body.png" class="dragon" id="fsDragon">

        <div id="freeSpinCounter" class="fs-counter" style="display:none;">
            FREE SPIN: <span id="fsLeft">0</span>
        </div>

        <div id="autoPanel" class="auto-panel" style="display:none;">
            <div class="auto-content">
                <h4>PILIH JUMLAH AUTO</h4>
                <div class="auto-grid">
                    <button onclick="startAuto(5)">5x</button>
                    <button onclick="startAuto(10)">10x</button>
                    <button onclick="startAuto(20)">20x</button>
                    <button onclick="startAuto(50)">50x</button>
                    <button onclick="startAuto(100)">100x</button>
                    <button onclick="startAuto(999999)">∞</button>
                </div>
                <button class="close-auto" onclick="toggleAutoPanel()">TUTUP</button>
            </div>
        </div>

        <div class="header">
            <div class="level-container">
                <div class="level-info">
                    <div class="lvl-badge"><span id="userLevel">LV. 1</span> <small id="levelName">NEWBIE</small></div>
                    <div id="lvlRewardAnim" class="reward-pop" style="display:none;">LEVEL UP +BONUS!</div>
                </div>
                <div class="xp-bar-bg"><div id="xpProgress" class="xp-bar-fill"></div></div>
            </div>
            <div id="multiDisplay" class="multi-bubble">x1</div>
        </div>

        <div class="slot-machine-frame">
            <div class="grid-container" id="grid"></div>
        </div>

        <div class="new-footer-panel">
            <div class="stats-box-row">
                <div class="stat-box"><label>SALDO</label><b id="balance">0</b></div>
                <div class="stat-box"><label>WIN</label><b id="winDisplay">0</b></div>
            </div>

            <div class="action-bar">
                <button id="spinBtn" class="gold-btn-spin" onclick="handleSpinClick()">
                    <span id="spinText">SPIN</span>
                </button>
                <div class="bet-info-pill"><span>BET</span><b id="betDisplay">25k</b></div>
                <button class="black-btn" onclick="toggleAutoPanel()">AUTO</button>
                <button class="black-btn" onclick="changeBet(25000)">+</button>
            </div>
        </div>
    </div>

    <div id="bigWinOverlay" class="win-announcement" style="display:none;">
        <canvas id="coinCanvas"></canvas>
        <div class="announcement-content">
            <h2 id="winTitle" class="gold-text">BIG WIN</h2>
            <div id="winAmountPop" class="amount-text">0</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
