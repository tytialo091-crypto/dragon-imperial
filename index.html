<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Imperial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay">
        <h1 class="shimmer">DRAGON IMPERIAL</h1>
        <button id="startBtn">MASUK GAME</button>
    </div>

    <div class="mobile-wrapper" id="mainGame" style="display:none;">
        <img src="assets/dragon.png" class="dragon-bg">
        
        <div class="header">
            <button id="infoBtn" class="icon-btn">ℹ️</button>
            <button id="muteBtn" class="icon-btn">🔊</button>
            <div class="jackpot-box">
                <small>GRAND JACKPOT</small>
                <div id="jpDisplay">5,000,000</div>
            </div>
        </div>

        <div class="grid-container" id="grid"></div>

        <div class="footer">
            <button id="buySpinBtn" class="buy-spin-btn">BUY FREE SPIN | <span id="buyCost">10,000</span></button>
            
            <div class="stats-row">
                <div class="stat-item"><span>SALDO</span><b id="balance">100,000</b></div>
                <div class="stat-item"><span>MENANG</span><b id="winDisplay">0</b></div>
            </div>

            <div class="controls">
                <div class="bet-adjuster">
                    <button onclick="changeBet(-10)">-</button>
                    <span id="betDisplay">BET: 100</span>
                    <button onclick="changeBet(10)">+</button>
                </div>
                <div class="action-row">
                    <label class="auto-btn"><input type="checkbox" id="autoCheck"> AUTO</label>
                    <button id="spinBtn">SPIN</button>
                </div>
            </div>
        </div>
    </div>

    <div id="infoOverlay" class="modal-overlay">
        <div class="modal-content">
            <h3>PAYTABLE</h3>
            <div class="pay-item">🐉 3+ SCATTER = 10 FREE SPINS</div>
            <div class="pay-item">💎 8+ JADE = x10.0</div>
            <div class="pay-item">🏮 8+ LANTERN = x5.0</div>
            <div class="pay-item">🪙 8+ COIN = x2.0</div>
            <button onclick="closeInfo()">TUTUP</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
