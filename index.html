<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Imperial - Gacor Tumble</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="coinCanvas"></canvas>

    <div id="overlay">
        <h1 class="shimmer-gold">DRAGON IMPERIAL</h1>
        <p style="color: gold; margin-bottom: 20px;">AKTIFKAN SUARA UNTUK PENGALAMAN TERBAIK</p>
        <button id="startBtn">MASUK GAME</button>
    </div>

    <div class="mobile-wrapper" id="mainGame" style="display:none;">
        <img src="assets/dragon.png" class="dragon-bg">
        
        <div class="header">
            <div class="top-nav">
                <button id="infoBtn" class="icon-btn">ℹ️ INFO</button>
                <button id="muteBtn" class="icon-btn">🔊 SOUND</button>
            </div>
            <div class="jackpot-box">
                <small>GRAND JACKPOT</small>
                <div id="jpDisplay">5.000.000</div>
            </div>
        </div>

        <div id="multiplierTracker" class="multiplier-tag" style="display:none;">
            <span id="multValue">x2</span>
        </div>

        <div class="grid-container" id="grid"></div>

        <div class="footer">
            <button id="buySpinBtn" class="buy-spin-btn">BUY FREE SPIN | <span id="buyCost">10.000</span></button>
            <div class="stats-row">
                <div class="stat-item"><span class="label">SALDO</span><b id="balance">100.000</b></div>
                <div class="stat-item"><span class="label">MENANG</span><b id="winDisplay">0</b></div>
            </div>
            <div class="controls">
                <div class="bet-adjuster">
                    <button onclick="changeBet(-10)">−</button>
                    <span id="betDisplay">BET: 100</span>
                    <button onclick="changeBet(10)">+</button>
                </div>
                <div class="action-row">
                    <div class="auto-wrap">
                        <input type="checkbox" id="autoCheck">
                        <label for="autoCheck">AUTO</label>
                    </div>
                    <button id="spinBtn">SPIN</button>
                </div>
            </div>
        </div>
    </div>

    <div id="bigWinOverlay" class="modal-overlay">
        <div class="modal-content big-win-panel">
            <h1 class="shimmer-gold">BIG WIN!</h1>
            <div id="bigWinAmount" class="win-amount-text">0</div>
            <button class="collect-btn" onclick="closeBigWin()">COLLECT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
